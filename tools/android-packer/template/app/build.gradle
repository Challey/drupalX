plugins {
    id 'com.android.application'
}

android {
    namespace 'x.app.shell'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "__APPLICATION_ID__"
        minSdk 24
        targetSdk 34
        versionCode __VERSION_CODE__
        versionName "__VERSION_NAME__"
        // WebView shell template line (docs/android-pack.md); app version is above.
        buildConfigField "String", "SHELL_VERSION", "\"__SHELL_VERSION__\""
        // Native capabilities declared in the app manifest (default: all on).
        buildConfigField "boolean", "CAP_LOCATION", "__CAP_LOCATION__"
        buildConfigField "boolean", "CAP_MICROPHONE", "__CAP_MICROPHONE__"
        buildConfigField "boolean", "CAP_PHOTO_UPLOAD", "__CAP_PHOTO_UPLOAD__"
    }

    buildTypes {
        release {
            minifyEnabled false
            // OSS sideload: sign with debug keystore until Play upload keystore is configured.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
