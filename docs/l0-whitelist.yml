# DrupalX L0 public-framework whitelist (Phase OE3).
# Copied by scripts/publish-l0-tree.sh into an export tree.
# Partner vault (L2), HA ops, and secrets stay out.

version: 1
layer: L0
license: GPL-2.0-or-later
description: >
  Foundation modules, public docs, DXEP OpenAPI, client shells, and pack
  scripts. Not a full production clone.

include:
  - README.md
  - composer.json
  - composer.lock
  - .gitignore
  - docs
  - scripts
  - clients
  - tools
  - .cursor/skills
  - web/modules/custom/dx_platform
  - web/modules/custom/dx_tenant
  - web/modules/custom/dx_portal
  - web/modules/custom/dx_auth
  - web/modules/custom/dx_ai_gateway
  - web/modules/custom/dx_appstore
  - web/modules/custom/dx_channel
  - web/modules/custom/dx_theme
  - web/modules/custom/dx_health
  - web/modules/custom/dx_delivery
  - web/modules/custom/dx_payment
  - web/modules/custom/dx_oss
  - web/modules/custom/dx_migrate
  - web/modules/custom/dx_opinion
  - web/modules/custom/dx_trust
  - web/modules/custom/dx_certs
  - web/modules/custom/dx_xmt_bridge
  - web/modules/custom/dx_ecosystem
  - web/themes/custom/dx_portal_theme

exclude:
  - web/modules/custom/dx_ecosystem/data/partner
  # I1/I4: the L2 Composer catalog is the private repository's index; the public
  # tree may only carry the code that *talks* to it.
  - web/modules/custom/dx_ecosystem/data/composer
  - docs/automatic-load-balancing.md
  - scripts/ops
  - .env
  - .env.local
  - .env.active_host

must_include:
  - docs/openapi/dxep-v1.yaml
  - docs/l0-whitelist.yml
  - docs/visibility.yml
  - web/modules/custom/dx_platform/dx_platform.info.yml
  - web/modules/custom/dx_channel/dx_channel.info.yml
  - web/modules/custom/dx_auth/dx_auth.info.yml
  - web/themes/custom/dx_portal_theme/templates/includes/dx-legal-footer.html.twig

must_exclude:
  - web/modules/custom/dx_ecosystem/data/partner/architecture-deep-1.0.md
  - web/modules/custom/dx_ecosystem/data/composer/manifest.yml
  - web/modules/custom/dx_ecosystem/data/partner/packer-deep-1.0.md
  - setup/ha/dns-failover.sh
  - scripts/ops/deploy-ha-production.sh
  - docs/automatic-load-balancing.md
  - docs/DEPLOY.md
  - docs/domain-cutover.md

# CI gate (Phase I / I4). `php scripts/lib/l0_publish.php --gate` runs with no
# .env and no database: it plans the export from `include`, then refuses to
# bless it while any registered file lacks an explicit visibility decision.
gate:
  # Set to false only to triage a legacy branch; the exit code goes back to 0
  # for missing registrations while warnings still print.
  enforce: true
  # Only these globs (matched against the path basename when the pattern has
  # no "/") must be registered in docs/visibility.yml.
  register:
    - '*.md'
  # Scan scope defaults to `include` above, so adding a path to the whitelist
  # automatically widens the gate: a new document there must be registered.
  # Set `scan:` only when the gate must cover less than the export.
  # Inside these directories, inheriting a parent key is not a decision: each
  # new file needs its own line in docs/visibility.yml.
  require_explicit:
    - docs
  # Pruned while walking, by path segment.
  skip_dirs:
    - vendor
    - node_modules
    - .git
