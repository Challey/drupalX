openapi: 3.0.3
info:
  title: DrupalX DXEP Channel API
  version: '1.0'
  description: >
    DXEP Channel read APIs for Flutter shell and WeChat mini-programs.
    All endpoints require Authorization Bearer token (decision D10-B).
servers:
  - url: /
paths:
  /api/dx/v1/channel/site:
    get:
      summary: Site card (org, theme, layout revision)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: DXEP success envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSite'
        '401':
          description: Missing or invalid token
        '403':
          description: Missing channel:read scope
  /api/dx/v1/channel/app-layout:
    get:
      summary: App Layout L1 (Flutter / mini-program)
      security:
        - bearerAuth: []
      parameters:
        - name: since_revision
          in: query
          schema:
            type: integer
          description: If equal to current revision, returns 304
      responses:
        '200':
          description: Layout document in DXEP envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeLayout'
        '304':
          description: Layout unchanged since since_revision
        '401':
          description: Missing or invalid token
        '403':
          description: Missing channel:read scope
  /exchange/changes:
    get:
      summary: Incremental change feed
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: updated_since
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        '200': { description: OK }
  /exchange/push:
    post:
      summary: Push up to 100 resources
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /exchange/packages:
    get:
      summary: List exchange packages
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      summary: Register JSON exchange package
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Registered }
  /exchange/packages/{package_id}:
    get:
      summary: Package status and report
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: package_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /api/dx/v1/exchange/packages/{package_id}/apply:
    post:
      summary: Apply registered package
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: package_id
          required: true
          schema: { type: string }
        - in: query
          name: dry_run
          schema: { type: boolean }
      responses:
        '200': { description: Applied (may be partial) }
  /api/dx/v1/exchange/packages/{package_id}/download:
    get:
      summary: Download registered package as offline ZIP (package.json)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: package_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: application/zip
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { description: Not found }

  /api/dx/v1/webhooks:
    get:
      summary: List outbound webhook endpoints (secrets redacted)
      description: Requires webhook:read (or exchange:write / channel:read alias).
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Envelope with endpoints[] }
        '401': { description: Missing Bearer token }
        '403': { description: Missing scope }
    post:
      summary: Register outbound webhook endpoint
      description: Requires webhook:write (or exchange:write). Secret returned once.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: 'https://example.com/hooks/dx' }
                secret: { type: string }
                events:
                  type: array
                  items: { type: string }
                  example: ['resource.published']
      responses:
        '201': { description: Created endpoint (includes secret once) }
        '400': { description: Validation error }
  /api/dx/v1/webhooks/test:
    post:
      summary: Fire test resource.published to registered endpoints
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Envelope with sent/failed counts }
  /api/dx/v1/webhooks/dead-letters:
    get:
      summary: List recent webhook dead-letter payloads
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200': { description: Envelope with dead_letters[] }
  /api/dx/v1/webhooks/{id}:
    delete:
      summary: Revoke webhook endpoint by id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Revoked }
        '404': { description: Not found }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    EnvelopeBase:
      type: object
      required: [ok, api_version, request_id, tenant_id]
      properties:
        ok:
          type: boolean
        api_version:
          type: string
          example: '1.0'
        request_id:
          type: string
        tenant_id:
          type: string
    EnvelopeSite:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                org_profile:
                  type: object
                theme:
                  type: object
                layout:
                  type: object
                capabilities:
                  type: array
                  items:
                    type: string
    EnvelopeLayout:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              description: DX-APP-LAYOUT document
              properties:
                spec:
                  type: string
                  example: DX-APP-LAYOUT
                revision:
                  type: integer
                checksum:
                  type: string
                navigation:
                  type: object
                pages:
                  type: object
                routes:
                  type: object
            meta:
              type: object
              properties:
                revision:
                  type: integer
