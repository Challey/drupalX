dx_oss.settings:
  type: config_object
  label: 'DrupalX Cloud OSS Storage settings'
  mapping:
    provider:
      type: string
      label: 'Default Cloud Storage Provider'
    aliyun:
      type: mapping
      label: 'Aliyun OSS'
      mapping:
        bucket:
          type: string
        endpoint:
          type: string
        cname_domain:
          type: string
    tencent:
      type: mapping
      label: 'Tencent Cloud COS'
      mapping:
        bucket:
          type: string
        region:
          type: string
        cdn_domain:
          type: string
