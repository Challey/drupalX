dx_payment.settings:
  type: config_object
  label: 'DrupalX Payment Gateway settings'
  mapping:
    mode:
      type: string
      label: 'Mode (sandbox or live)'
    wechat:
      type: mapping
      label: 'WeChat Pay Settings'
      mapping:
        enabled:
          type: boolean
        mch_id:
          type: string
        app_id:
          type: string
        api_v3_key:
          type: string
    alipay:
      type: mapping
      label: 'Alipay Settings'
      mapping:
        enabled:
          type: boolean
        app_id:
          type: string
        private_key:
          type: string
        alipay_public_key:
          type: string
    foreign:
      type: mapping
      label: 'Foreign issuance payment sheet'
      mapping:
        enabled:
          type: boolean
          label: 'Enable foreign issuance sheet'
        merchant_name:
          type: string
          label: 'Merchant display name'
        currency:
          type: string
          label: 'Display currency'
        methods:
          type: mapping
          label: 'Sheet payment method types'
          mapping:
            card:
              type: boolean
              label: 'Card (upper sheet option)'
            google_pay:
              type: boolean
              label: 'Google Pay fingerprint wallet'
            apple_pay:
              type: boolean
              label: 'Apple Pay fingerprint wallet'
