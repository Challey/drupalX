dx_auth.enterprise_lookup:
  path: '/dx/auth/enterprise_lookup'
  defaults:
    _controller: '\Drupal\dx_auth\Controller\EnterpriseAuthController::lookup'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dx_auth.enterprise_login:
  path: '/dx/auth/enterprise_login'
  defaults:
    _controller: '\Drupal\dx_auth\Controller\EnterpriseAuthController::login'
  requirements:
    _access: 'TRUE'
    _csrf_request_header_token: 'TRUE'
  methods: [POST]

dx_auth.admin_bindings:
  path: '/admin/dx/auth/enterprise'
  defaults:
    _form: '\Drupal\dx_auth\Form\EnterpriseBindingForm'
    _title: 'Enterprise ID bindings'
  requirements:
    _permission: 'administer dx auth'

dx_auth.admin_providers:
  path: '/admin/dx/auth/providers'
  defaults:
    _form: '\Drupal\dx_auth\Form\AuthProviderSettingsForm'
    _title: 'Login providers'
  requirements:
    _permission: 'administer dx auth'

dx_auth.wechat_qrcode:
  path: '/dx/auth/wechat_qrcode'
  defaults:
    _controller: '\Drupal\dx_auth\Controller\SocialAuthController::wechatQrcode'
