dx_auth.wechat_callback:
  path: '/dx/auth/wechat_callback'
  defaults:
    _controller: '\Drupal\dx_auth\Controller\SocialAuthController::wechatCallback'
  requirements:
    _access: 'TRUE'
  methods: [GET, POST]

dx_auth.wechat_jump:
  path: '/dx/auth/wechat_jump'
  defaults:
    _controller: '\Drupal\dx_auth\Controller\SocialAuthController::wechatJump'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dx_auth.sms_send:
