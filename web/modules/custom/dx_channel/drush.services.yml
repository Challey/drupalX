services:
  dx_channel.commands:
    class: Drupal\dx_channel\Commands\ChannelCommands
    arguments:
      - '@dx_channel.auth'
      - '@dx_channel.app_layout'
      - '@config.factory'
    tags:
      - { name: drush.command }
  dx_channel.exchange_commands:
    class: Drupal\dx_channel\Commands\ExchangeCommands
    arguments: ['@dx_channel.exchange']
    tags:
      - { name: drush.command }
  dx_channel.webhook_commands:
    class: Drupal\dx_channel\Commands\WebhookCommands
    arguments: ['@dx_channel.webhook']
    tags:
      - { name: drush.command }
  dx_channel.audit_commands:
    class: Drupal\dx_channel\Commands\AuditCommands
    arguments: ['@dx_channel.audit']
    tags:
      - { name: drush.command }

