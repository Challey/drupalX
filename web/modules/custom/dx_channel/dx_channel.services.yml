services:
  dx_channel.envelope:
    class: Drupal\dx_channel\Service\ChannelEnvelope
  dx_channel.auth:
    class: Drupal\dx_channel\Service\ChannelAuth
    arguments:
      - '@state'
  dx_channel.app_layout:
    class: Drupal\dx_channel\Service\AppLayoutRepository
    arguments:
      - '@config.factory'
      - '@extension.list.module'
      - '@dx_theme.studio'
  dx_channel.site_projector:
    class: Drupal\dx_channel\Service\SiteProjector
    arguments:
      - '@config.factory'
      - '@dx_channel.app_layout'
      - '@dx_theme.studio'
  dx_channel.content_projector:
    class: Drupal\dx_channel\Service\ContentProjector
    arguments:
      - '@entity_type.manager'
  dx_channel.ingest:
    class: Drupal\dx_channel\Service\IngestService
    arguments:
      - '@entity_type.manager'
      - '@state'
      - '@dx_channel.content_projector'
  logger.channel.dx_channel:
    parent: logger.channel_base
    arguments: ['dx_channel']
  dx_channel.exchange:
    class: Drupal\dx_channel\Service\ExchangeService
    arguments:
      - '@state'
      - '@dx_channel.ingest'

