dx_channel.site:
  path: '/api/dx/v1/channel/site'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ChannelController::site'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dx_channel.app_layout:
  path: '/api/dx/v1/channel/app-layout'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ChannelController::appLayout'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dx_channel.contents:
  path: '/api/dx/v1/channel/contents'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ChannelController::contents'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dx_channel.content:
  path: '/api/dx/v1/channel/contents/{id}'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ChannelController::content'
  requirements:
    _access: 'TRUE'
    id: '[A-Za-z0-9_\\-]+'
  methods: [GET]

dx_channel.products:
  path: '/api/dx/v1/channel/products'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ChannelController::products'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dx_channel.ingest_upsert:
  path: '/api/dx/v1/ingest/resources/{type}/{external_id}'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ChannelController::ingestUpsert'
  requirements:
    _access: 'TRUE'
    type: '[a-z_]+'
    external_id: '[A-Za-z0-9._\\-]+'
  methods: [PUT]

dx_channel.settings:
  path: '/admin/dx/channel'
  defaults:
    _form: '\Drupal\dx_channel\Form\ChannelSettingsForm'
    _title: 'DXEP Channel'
  requirements:
    _permission: 'administer dx channel'

dx_channel.exchange_changes:
  path: '/api/dx/v1/exchange/changes'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ExchangeController::changes'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dx_channel.exchange_push:
  path: '/api/dx/v1/exchange/push'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ExchangeController::push'
  requirements:
    _access: 'TRUE'
  methods: [POST]

dx_channel.exchange_packages:
  path: '/api/dx/v1/exchange/packages'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ExchangeController::packages'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dx_channel.exchange_package_create:
  path: '/api/dx/v1/exchange/packages'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ExchangeController::packageCreate'
  requirements:
    _access: 'TRUE'
  methods: [POST]

dx_channel.exchange_package_get:
  path: '/api/dx/v1/exchange/packages/{package_id}'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ExchangeController::packageGet'
  requirements:
    _access: 'TRUE'
    package_id: '[A-Za-z0-9._\\-]+'
  methods: [GET]

dx_channel.exchange_package_apply:
  path: '/api/dx/v1/exchange/packages/{package_id}/apply'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ExchangeController::packageApply'
  requirements:
    _access: 'TRUE'
    package_id: '[A-Za-z0-9._\\-]+'
  methods: [POST]

dx_channel.exchange_package_download:
  path: '/api/dx/v1/exchange/packages/{package_id}/download'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\ExchangeController::packageDownload'
  requirements:
    _access: 'TRUE'
    package_id: '[A-Za-z0-9._\\-]+'
  methods: [GET]

dx_channel.audit:
  path: '/admin/dx/channel/audit'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\AuditController::recent'
    _title: 'DXEP API 审计'
  requirements:
    _permission: 'administer dx channel'

dx_channel.webhooks_list:
  path: '/api/dx/v1/webhooks'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\WebhookController::list'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dx_channel.webhooks_register:
  path: '/api/dx/v1/webhooks'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\WebhookController::register'
  requirements:
    _access: 'TRUE'
  methods: [POST]

dx_channel.webhooks_test:
  path: '/api/dx/v1/webhooks/test'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\WebhookController::test'
  requirements:
    _access: 'TRUE'
  methods: [POST]

dx_channel.webhooks_dead_letters:
  path: '/api/dx/v1/webhooks/dead-letters'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\WebhookController::deadLetters'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dx_channel.webhooks_dead_letters_retry:
  path: '/api/dx/v1/webhooks/dead-letters/retry'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\WebhookController::retryDeadLetters'
  requirements:
    _access: 'TRUE'
  methods: [POST]

dx_channel.webhooks_revoke:
  path: '/api/dx/v1/webhooks/{id}'
  defaults:
    _controller: '\Drupal\dx_channel\Controller\WebhookController::revoke'
  requirements:
    _access: 'TRUE'
    id: '[A-Za-z0-9_\\-]+'
  methods: [DELETE]
