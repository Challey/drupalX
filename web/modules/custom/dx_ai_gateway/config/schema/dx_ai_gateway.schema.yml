dx_ai_gateway.settings:
  type: config_object
  label: 'DrupalX AI Gateway settings'
  mapping:
    default_provider:
      type: string
      label: 'Default provider'
    system_prompt:
      type: string
    providers:
      type: mapping
      label: 'Providers'
      mapping:
        '*':
          type: mapping
          mapping:
            label:
              type: string
              label: 'Label'
            base_url:
              type: string
              label: 'Base URL'
            model:
              type: string
              label: 'Model'
    failover_order:
      type: sequence
      label: 'Failover order'
      sequence:
        type: string
    monthly_quota:
      type: integer
      label: 'Monthly quota'
    prefer_ai_module:
      type: boolean
      label: 'Prefer Drupal AI provider manager'
    enable_streaming:
      type: boolean
      label: 'Enable SSE streaming'
    max_history_turns:
      type: integer
      label: 'Max multi-turn history pairs'
    inject_knowledge_base:
      type: boolean
      label: 'Inject product/company knowledge'
    knowledge_max_products:
      type: integer
      label: 'Max products in knowledge context'
