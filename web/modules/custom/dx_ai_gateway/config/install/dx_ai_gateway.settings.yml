default_provider: deepseek
system_prompt: '你是 DrupalX 企业门户的智能客服助手，用简洁中文回答访客关于产品、服务与开通流程的问题。不确定时请引导用户联系人工或登录控制台。'
providers:
  openai:
    label: OpenAI
    base_url: 'https://api.openai.com/v1'
    model: gpt-4o-mini
  deepseek:
    label: DeepSeek
    base_url: 'https://api.deepseek.com/v1'
    model: deepseek-chat
  qwen:
    label: '通义千问'
    base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
    model: qwen-plus
  zhipu:
    label: '智谱 GLM'
    base_url: 'https://open.bigmodel.cn/api/paas/v4'
    model: glm-4
failover_order:
  - deepseek
  - qwen
  - zhipu
  - openai
monthly_quota: 100000
