dcn_ai_gateway.settings:
  path: '/admin/dcn/ai-gateway'
  defaults:
    _form: '\Drupal\dcn_ai_gateway\Form\AiGatewaySettingsForm'
    _title: 'AI Gateway settings'
  requirements:
    _permission: 'administer dcn ai gateway'

dcn_ai_gateway.chat:
  path: '/dcn/ai/chat'
  defaults:
    _controller: '\Drupal\dcn_ai_gateway\Controller\ChatController::chat'
  requirements:
    _permission: 'access dcn ai chat'
  methods: [POST]
