dx_ecosystem.settings:
  type: config_object
  label: 'DrupalX open ecosystem settings'
  mapping:
    personal_registration_enabled:
      type: boolean
      label: 'Allow personal tenant registration'
    require_ral_on_install:
      type: boolean
      label: 'Require DX-RAL acknowledgment on install'
    l2_composer_host:
      type: string
      label: 'Private Composer host for L2 credentials'
    l2_git_host:
      type: string
      label: 'Private Git host for L2 credentials'
    current_ral_id:
      type: string
      label: 'Current DX-RAL agreement id'
    current_dpa_id:
      type: string
      label: 'Current DPA agreement id'
    docs_visibility_default:
      type: string
      label: 'Default docs visibility'
    l2_repository_enabled:
      type: boolean
      label: 'Serve the L2 Composer metadata and signed downloads'
    l2_composer_base_url:
      type: string
      label: 'Absolute base url of the private Composer host (empty = placeholder)'
    l2_repository_root:
      type: string
      label: 'Filesystem root of the L2 Composer repository'
    l2_composer_driver:
      type: string
      label: 'Host driver: auto, satis, artifactory or loopback'
    l2_token_header:
      type: string
      label: 'Request header carrying the dxl2_ token'
    l2_signing_key:
      type: string
      label: 'HMAC secret for signed dist urls'
    l2_download_ttl:
      type: integer
      label: 'Lifetime of a signed dist url, seconds'
    l2_dist_mode:
      type: string
      label: 'Dist delivery mode: served or artifact'
