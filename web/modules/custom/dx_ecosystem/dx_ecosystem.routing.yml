dx_ecosystem.api_docs:
  path: '/dx/api/docs'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\ApiDocsController::docs'
    _title: 'DrupalX DXEP API'
  requirements:
    _access: 'TRUE'

dx_ecosystem.openapi_yaml:
  path: '/dx/api/openapi.yaml'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\ApiDocsController::openapi'
  requirements:
    _access: 'TRUE'

dx_ecosystem.agreements:
  path: '/dx/ecosystem/agreements'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\AgreementController::list'
    _title: 'DrupalX ecosystem agreements'
  requirements:
    _permission: 'access dx ecosystem agreements'

dx_ecosystem.agreement_view:
  path: '/dx/ecosystem/agreements/{agreement_id}'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\AgreementController::view'
    _title_callback: '\Drupal\dx_ecosystem\Controller\AgreementController::title'
  requirements:
    _permission: 'access dx ecosystem agreements'
    agreement_id: '[a-z0-9_-]+'

dx_ecosystem.partner_docs:
  path: '/dx/ecosystem/partner'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\PartnerDocsController::list'
    _title: 'Partner documentation vault'
  requirements:
    _custom_access: 'dx_ecosystem.gate:partnerDocsAccess'

dx_ecosystem.partner_doc:
  path: '/dx/ecosystem/partner/{doc_id}'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\PartnerDocsController::view'
    _title_callback: '\Drupal\dx_ecosystem\Controller\PartnerDocsController::title'
  requirements:
    _custom_access: 'dx_ecosystem.gate:partnerDocsAccess'
    doc_id: '[a-z0-9_-]+'

dx_ecosystem.dpa_sign:
  path: '/admin/dx/ecosystem/dpa'
  defaults:
    _form: '\Drupal\dx_ecosystem\Form\DpaSignForm'
    _title: 'Sign developer participation agreement'
  requirements:
    _permission: 'sign dx developer agreement'

dx_ecosystem.developers:
  path: '/admin/dx/ecosystem/developers'
  defaults:
    _form: '\Drupal\dx_ecosystem\Form\DeveloperCertifyForm'
    _title: 'Certify developers'
  requirements:
    _permission: 'certify dx developers'

dx_ecosystem.settings:
  path: '/admin/dx/ecosystem/settings'
  defaults:
    _form: '\Drupal\dx_ecosystem\Form\EcosystemSettingsForm'
    _title: 'Open ecosystem settings'
  requirements:
    _permission: 'administer dx ecosystem'
