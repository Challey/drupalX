dx_ecosystem.api_docs:
  path: '/dx/api/docs'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\ApiDocsController::docs'
    _title: 'DrupalX DXEP API'
  requirements:
    _access: 'TRUE'

dx_ecosystem.openapi_yaml:
  path: '/dx/api/openapi.yaml'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\ApiDocsController::openapi'
  requirements:
    _access: 'TRUE'

dx_ecosystem.agreements:
  path: '/dx/ecosystem/agreements'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\AgreementController::list'
    _title: 'DrupalX ecosystem agreements'
  requirements:
    _permission: 'access dx ecosystem agreements'

dx_ecosystem.agreement_view:
  path: '/dx/ecosystem/agreements/{agreement_id}'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\AgreementController::view'
    _title_callback: '\Drupal\dx_ecosystem\Controller\AgreementController::title'
  requirements:
    _permission: 'access dx ecosystem agreements'
    agreement_id: '[a-z0-9_-]+'

dx_ecosystem.partner_docs:
  path: '/dx/ecosystem/partner'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\PartnerDocsController::list'
    _title: 'Partner documentation vault'
  requirements:
    _custom_access: 'dx_ecosystem.gate:partnerDocsAccess'

dx_ecosystem.partner_doc:
  path: '/dx/ecosystem/partner/{doc_id}'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\PartnerDocsController::view'
    _title_callback: '\Drupal\dx_ecosystem\Controller\PartnerDocsController::title'
  requirements:
    _custom_access: 'dx_ecosystem.gate:partnerDocsAccess'
    doc_id: '[a-z0-9_-]+'

dx_ecosystem.dpa_sign:
  path: '/admin/dx/ecosystem/dpa'
  defaults:
    _form: '\Drupal\dx_ecosystem\Form\DpaSignForm'
    _title: 'Sign developer participation agreement'
  requirements:
    _permission: 'sign dx developer agreement'

dx_ecosystem.developers:
  path: '/admin/dx/ecosystem/developers'
  defaults:
    _form: '\Drupal\dx_ecosystem\Form\DeveloperCertifyForm'
    _title: 'Certify developers'
  requirements:
    _permission: 'certify dx developers'

dx_ecosystem.settings:
  path: '/admin/dx/ecosystem/settings'
  defaults:
    _form: '\Drupal\dx_ecosystem\Form\EcosystemSettingsForm'
    _title: 'Open ecosystem settings'
  requirements:
    _permission: 'administer dx ecosystem'

dx_ecosystem.credentials:
  path: '/dx/ecosystem/credentials'
  defaults:
    _form: '\Drupal\dx_ecosystem\Form\PartnerCredentialForm'
    _title: 'L2 Composer / Git credential'
  requirements:
    _custom_access: 'dx_ecosystem.gate:partnerDocsAccess'

# --- Phase I / I1: private Composer host (token, not session, is the credential).
# The subscriber L2RepositoryAuthSubscriber answers 401 before these controllers
# run, so `_access: TRUE` here only means "no Drupal role is required".
dx_ecosystem.l2_packages:
  path: '/dx/ecosystem/l2/packages.json'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\L2RepositoryController::root'
  requirements:
    _access: 'TRUE'

# Provider keys are `vendor/package` flattened with dashes, plus `.json`.
dx_ecosystem.l2_provider:
  path: '/dx/ecosystem/l2/providers/{provider}'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\L2RepositoryController::provider'
  requirements:
    _access: 'TRUE'
    provider: '[A-Za-z0-9_.\-]+'

# `{artifact}` is repository-relative (`dist/drupalx/dx_oss/1.0.0/x.zip`), so it
# must span slashes; the controller re-checks it against the manifest allow-list.
dx_ecosystem.l2_dist:
  path: '/dx/ecosystem/l2/dist/{artifact}'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\L2RepositoryController::dist'
  requirements:
    _access: 'TRUE'
    artifact: '[A-Za-z0-9_.\-/]+'
  options:
    no_cache: TRUE

dx_ecosystem.l2_plan:
  path: '/dx/ecosystem/l2/plan'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\L2RepositoryController::plan'
  requirements:
    _access: 'TRUE'

# --- Phase I / I3: credential issue / rotation / usage report.
dx_ecosystem.credential_report:
  path: '/admin/dx/ecosystem/credentials'
  defaults:
    _controller: '\Drupal\dx_ecosystem\Controller\CredentialReportController::report'
    _title: 'L2 credential report'
  requirements:
    _permission: 'administer dx ecosystem'
