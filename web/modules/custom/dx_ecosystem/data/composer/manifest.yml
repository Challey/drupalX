# DrupalX L2 private Composer catalog (Phase I / I1).
#
# What the Satis-shaped metadata is generated from. Everything in here is L2:
# partner-only packages that never appear on.packagist.org nor in the L0 public
# tree. Artifacts are repository-relative paths below `l2_repository_root`; the
# builder only signs a dist url once the zip really exists on disk.
#
# Verified by dx_ecosystem/tests/pure-assertions.php and by
# `drush dx:ecosystem-l2-repo --lint`.

packages:
