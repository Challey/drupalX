    description: 'Turnkey capability: WeChat Pay / Alipay bridge (commerce).'
    license: GPL-2.0-or-later AND LicenseRef-DrupalX-Partner
    trust_level: curated
    dpa_required: true
    versions:
      - version: 1.0.0
        dist_file: dist/drupalx/dx_payment/1.0.0/drupalx-dx_payment-1.0.0.zip
