dcn_appstore.catalog:
  path: '/appstore'
  defaults:
    _controller: '\Drupal\dcn_appstore\Controller\AppStoreController::catalog'
    _title: 'App Store'
  requirements:
    _permission: 'browse dcn appstore'

dcn_appstore.request:
  path: '/appstore/request/{dcn_app_package}'
  defaults:
    _form: '\Drupal\dcn_appstore\Form\InstallRequestForm'
    _title: 'Request installation'
  requirements:
    _permission: 'request dcn app install'
  options:
    parameters:
      dcn_app_package:
        type: entity:dcn_app_package
