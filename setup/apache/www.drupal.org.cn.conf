<VirtualHost *:88>
ServerAdmin admin@drupal.org.cn
php_admin_value open_basedir "/home/wwwroot/drupalX/web:/home/wwwroot/drupalX:/tmp/:/var/tmp/:/proc/"
DocumentRoot "/home/wwwroot/drupalX/web"
ServerName www.drupal.org.cn
ServerAlias www.drupal.org.cn drupal.org.cn x.drupal.org.cn
ErrorLog "/home/wwwlogs/drupalX-www-error_log"
CustomLog "/home/wwwlogs/drupalX-www-access_log" combined
<Directory "/home/wwwroot/drupalX/web">
    SetOutputFilter DEFLATE
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>
</VirtualHost>
