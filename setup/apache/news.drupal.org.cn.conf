<VirtualHost *:88>
ServerAdmin admin@xmt.pub
php_admin_value open_basedir "/home/wwwroot/xmt/web:/home/wwwroot/xmt:/tmp/:/var/tmp/:/proc/"
DocumentRoot "/home/wwwroot/xmt/web"
ServerName news.drupal.org.cn
ServerAlias news.drupal.org.cn duanwen.drupal.org.cn drupalcn.wsl
ErrorLog "/home/wwwlogs/news.drupal.org.cn-error_log"
CustomLog "/home/wwwlogs/news.drupal.org.cn-access_log" combined
<Directory "/home/wwwroot/xmt/web">
    SetOutputFilter DEFLATE
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>
</VirtualHost>
