# Install on B as /usr/local/nginx/conf/proxy-pass-php.conf.
# B must stay local during DNS takeover. Never proxy back to A: that creates
# a loop or makes B's availability depend on the failed node.
location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}

location / {
    try_files $uri @dx_apache;
}

location @dx_apache {
    internal;
    proxy_pass http://127.0.0.1:88;
    include proxy.conf;
}

location ~ [^/]\.php(/|$) {
    proxy_pass http://127.0.0.1:88;
    include proxy.conf;
}
