# Install on A as /usr/local/nginx/conf/proxy-pass-php.conf.
# Static files remain on A; Drupal/PHP requests use B, with A as backup.
location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}

location / {
    try_files $uri @apache;
}

location @apache {
    internal;
    proxy_pass http://dxBusinessApache;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    include proxy.conf;
}

location ~ [^/]\.php(/|$) {
    proxy_pass http://dxBusinessApache;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    include proxy.conf;
}
