# Install on A as /usr/local/nginx/conf/balanceServers.conf and include it
# once from the nginx.conf http {} block.
#
# B is the only normal business backend. A performs PHP/business processing
# only while B is unavailable; "backup" is deliberate, not a weight.
upstream dxBusinessApache {
    server 172.16.34.126:88 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:88 backup;
    keepalive 32;
}
