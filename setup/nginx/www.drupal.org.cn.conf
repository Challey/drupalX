# DrupalX product site — www + apex + legacy x subdomain.
# 短闻 moved to news.drupal.org.cn (XMT).
server
{
    listen 80;
    server_name www.drupal.org.cn drupal.org.cn x.drupal.org.cn;
    index index.php index.html index.htm;
    root /home/wwwroot/drupalX/web;

    include proxy-pass-php.conf;

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|svg|webp|ico)$
    {
        expires 30d;
    }

    location ~ .*\.(js|css)?$
    {
        expires 12h;
    }

    location ~ /\.
    {
        deny all;
    }

    access_log /home/wwwlogs/drupalX-www.log;
}
