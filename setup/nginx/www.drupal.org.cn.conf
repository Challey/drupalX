# DrupalX product homepage — same codebase as x.drupal.org.cn
# Apex HTTP → https://www; www/x HTTPS serve DrupalX.
# After apex A record exists, issue cert: acme.sh --issue -d www.drupal.org.cn -d drupal.org.cn -w /home/wwwroot/drupalX/web
# then enable the commented HTTPS apex server block below.

server
{
    listen 80;
    server_name drupal.org.cn;
    location ^~ /.well-known/ {
        allow all;
        default_type text/plain;
        root /home/wwwroot/drupalX/web;
    }
    location / {
        return 301 https://www.drupal.org.cn$request_uri;
    }
    access_log /home/wwwlogs/drupal.org.cn.log;
}

server
{
    listen 80;
    server_name www.drupal.org.cn;
    index index.php index.html index.htm;
    root /home/wwwroot/drupalX/web;

    location ^~ /.well-known/ {
        allow all;
        default_type text/plain;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /home/wwwlogs/www.drupal.org.cn.log;
}

server
{
    listen 443 ssl;
    http2 on;
    server_name www.drupal.org.cn;
    index index.php index.html index.htm;
    root /home/wwwroot/drupalX/web;

    ssl_certificate /usr/local/nginx/conf/ssl/www.drupal.org.cn/fullchain.cer;
    ssl_certificate_key /usr/local/nginx/conf/ssl/www.drupal.org.cn/www.drupal.org.cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5";
    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_dhparam /usr/local/nginx/conf/ssl/dhparam.pem;

    include proxy-pass-php.conf;

    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|woff2?|ttf|eot|svg)$
    {
        expires 30d;
        try_files $uri @apache;
    }

    location ~* \.(js|css)$
    {
        expires 12h;
        try_files $uri @apache;
    }

    location ^~ /.well-known/ {
        allow all;
        default_type text/plain;
    }

    location ~ /\. {
        deny all;
    }

    access_log /home/wwwlogs/www.drupal.org.cn.log;
}

