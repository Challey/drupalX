# 短闻（原 www.drupal.org.cn 门户内容）— 二级域名 news.drupal.org.cn
# 站点目录仍为 XMT sites/drupal.org.cn（Drupal 垂直 + 短闻入口）。
server
{
    listen 80;
    server_name news.drupal.org.cn duanwen.drupal.org.cn;
    index index.php index.html index.htm;
    root /home/wwwroot/xmt/web;

    include proxy-pass-php.conf;

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|svg|webp|ico)$
    {
        expires 30d;
    }

    location ~ .*\.(js|css)?$
    {
        expires 12h;
    }

    location ~ /\.
    {
        deny all;
    }

    access_log /home/wwwlogs/news.drupal.org.cn.log;
}
